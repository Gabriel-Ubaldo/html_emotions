<!DOCTYPE html>
<html>
<body>
<h2 id="encabezado">¿Qué hacemos este fin de semana?</h2>
<p id="demo">JavaScript can change HTML content.</p>
<button type="button" onclick="document.getElementById('demo').innerHTML = '¿Qué te parece si visitamos el centro?!'">Sobre mí</button>
<button type="button" onclick="document.getElementById('demo').innerHTML = 'Me gusta!';document.getElementById('encabezado').style.color = 'blue';
">👍</button>
<button type="button" onclick="document.getElementById('demo').innerHTML = 'Me encanta!';
;document.getElementById('encabezado').style.color = 'red';">❤️</button>
<button type="button" onclick="document.getElementById('demo').innerHTML = 'Mejor vamos al cine';
;document.getElementById('encabezado').style.color = 'orange';">🍿</button>
</body>
</html>
